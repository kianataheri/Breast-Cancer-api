services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: breast-cancer-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: breast-cancer-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend